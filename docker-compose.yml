volumes:
  data:
  sql_data:
  kibana-data:
  logstash-volume:
services:
  es01:
    container_name: elasticsearch
    hostname: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      ELASTIC_USERNAME: elastic
      ELASTIC_PASSWORD: Faiziraja143@f
      bootstrap.memory_lock: "true"
      discovery.type: single-node
    volumes:
      - data:/usr/share/elasticsearch
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./certls/es01.crt:/usr/share/elasticsearch/config/es01.crt
      - ./certls/rootCA.pem:/usr/share/elasticsearch/config/rootCA.pem
      - ./certls/es01.key:/usr/share/elasticsearch/config/es01.key
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elk

  kibana:
    container_name: kibana
    hostname: kibana
    image: docker.elastic.co/kibana/kibana:8.15.0
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: "https://es01:9200"
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml
      - ./certls/kib01.crt:/usr/share/kibana/config/kib01.crt
      - ./certls/kib01.key:/usr/share/kibana/config/kib01.key
      - ./certls/rootCA.pem:/usr/share/kibana/config/rootCA.pem
      - kibana-data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    networks:
      - elk
    depends_on:
      - es01

  logstash:
    container_name: logstash
    hostname: logstash
    image: docker.elastic.co/logstash/logstash:8.15.0
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOST: "https://es01:9200"
      ELASTIC_USERNAME: elastic
      ELASTIC_PASSWORD: Faiziraja143@f
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logstash/config/pipeline.yml:/usr/share/logstash/config/pipeline.yml
      - ./certls/rootCA.pem:/usr/share/logstash/config/rootCA.pem
      - logstash-volume:/usr/share/logstash
      - ./logstash/jars/mssql-jdbc-9.2.1.jre8.jar:/usr/share/logstash/config/mssql-jdbc-9.2.1.jre8.jar
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - elk
    depends_on:
      - es01

  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: P@ssw0rd
    volumes:
      - sql_data:/var/opt/mssql
    ports:
      - "1433:1433"
    networks:
      - elk

networks:
  elk:
    driver: bridge

